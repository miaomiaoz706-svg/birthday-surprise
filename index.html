<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日惊喜</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            min-height:100vh;
            background:#111420;
            color:#fff;
            font-family:system-ui;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        h1{
            font-size:2.8rem;
            margin-bottom:24px;
            background:linear-gradient(90deg,#ffd770,#ff7898);
            -webkit-background-clip:text;
            color:transparent;
        }
        .msg{
            font-size:1.2rem;
            margin-bottom:30px;
            opacity:0.9;
        }
        button{
            padding:12px 28px;
            font-size:1rem;
            border:none;
            border-radius:999px;
            background:#ff7898;
            color:white;
            cursor:pointer;
        }
        .firework{
            position:fixed;
            width:6px;height:6px;
            border-radius:50%;
        }
    </style>
</head>
<body>
    <h1>生日惊喜</h1>
    <div class="msg">愿岁岁平安，万事欢喜✨</div>
    <button id="btn">开启礼花</button>

    <script>
        const btn=document.getElementById('btn');
        function fire(x,y){
            for(let i=0;i<40;i++){
                const dot=document.createElement('div');
                dot.className='firework';
                dot.style.left=x+'px';
                dot.style.top=y+'px';
                dot.style.background=['#ffd770','#ff7898','#70d8ff','#98ff78'][Math.floor(Math.random()*4)];
                document.body.appendChild(dot);
                const angle=Math.PI*2*Math.random();
                const speed=60+Math.random()*100;
                const vx=Math.cos(angle)*speed;
                const vy=Math.sin(angle)*speed;
                let px=x,py=y;
                function step(){
                    px+=vx*0.02;
                    py+=vy*0.02;
                    dot.style.left=px+'px';
                    dot.style.top=py+'px';
                    dot.style.opacity-=0.025;
                    if(dot.style.opacity>0){
                        requestAnimationFrame(step);
                    }else dot.remove();
                }
                requestAnimationFrame(step);
            }
        }
        btn.onclick=()=>{
            for(let i=0;i<6;i++){
                setTimeout(()=>{
                    fire(window.innerWidth*Math.random(),window.innerHeight*Math.random());
                },i*250);
            }
        }
    </script>
</body>
</html>
